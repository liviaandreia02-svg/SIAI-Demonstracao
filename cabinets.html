{% extends "base.html" %}{% block content %}<h1>Armários</h1><div class="card"><form method="post" class="formgrid"><div><label>Nome/ID</label><input name="name" required></div><div><label>Sala</label><select name="room" required>{% for r in rooms %}<option value="{{r.id}}">{{r.name}}</option>{% endfor %}</select></div><div><label>Localização</label><input name="location"></div><button>Cadastrar armário</button></form></div><div class="card"><table><tr><th>Armário</th><th>Sala</th><th>Local</th><th>Situação</th><th>Ação</th></tr>{% for c in cabinets %}<tr><td>{{c.name}}</td><td>{{c.room}}</td><td>{{c.location}}</td><td>{{'Ativo' if c.active else 'Inativo'}}</td><td><form method="post" action="/cabinets/{{c.id}}/toggle"><button class="secondary">{{'Inativar' if c.active else 'Reativar'}}</button></form></td></tr>{% endfor %}</table></div>{% endblock %}
